<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CraftHub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%235aa2ff'/%3E%3Cpath d='M41 21.5a15.5 15.5 0 1 0 0 21' fill='none' stroke='%2306101f' stroke-width='7.5' stroke-linecap='round'/%3E%3Ccircle cx='47' cy='32' r='5' fill='%2306101f'/%3E%3C/svg%3E">
<meta name="theme-color" content="#121316">
<link rel="preload" href="/static/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script>
  /* Apply the saved theme before first paint. */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('crafthub.settings') || '{}');
      var th = s.theme || 'system';
      document.documentElement.dataset.eff = th === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : th;
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="bar">
  <a class="wordmark" href="/"><img class="logo" src="/static/logo.svg" alt="" width="26" height="26"><span id="wm">CRAFTHUB</span></a>
  <div class="cell tagcell"><span class="tag" id="tag">Self-hosted</span><span class="hud" id="suite">Craft App Suite</span></div>
  <div class="grow"></div>
  <div class="right" id="hright"></div>
</header>

<main>
  <div id="notices"></div>
  <div class="strip">
    <div class="chips" id="chips"></div>
    <div class="grow"></div>
    <div class="field" id="fieldSort"><span class="hud" id="sortLbl">Sort</span><select id="sortSel" aria-labelledby="sortLbl"></select></div>
    <input class="searchbox" id="q" type="search" placeholder="Search apps" autocomplete="off">
    <button class="btn" id="addApp" hidden>Add app</button>
    <button class="btn primary" id="updAll" hidden></button>
  </div>
  <div id="content"><div class="empty">Loading…</div></div>
</main>

<footer class="bar2" id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dh"><h3 id="dlgTitle"></h3><button class="x" id="dlgClose" aria-label="Close">✕</button></div><div class="db" id="dlgBody"></div></dialog>
<dialog id="alertDlg" style="width:min(480px,94vw)"><div id="alertBody"></div></dialog>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="App details"></aside>
<div id="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
